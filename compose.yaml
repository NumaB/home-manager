services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: home_manager
      POSTGRES_USER: home_manager
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - home-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_manager -d home_manager"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  home-manager-postgres:
